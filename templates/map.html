<!DOCTYPE html>
<html>
<head>
  <title>Vallacar - Live Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #map { height: 500px; width: 100%; border-radius: 10px; }
    body { font-family: Arial; padding: 20px; }
  </style>
</head>
<body>
  <h2>VALLACAR - Bacolod / Talisay Map</h2>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Talisay / Bacolod - palitan mo lang kung ibang terminal
    var map = L.map('map').setView([10.73, 122.96], 13);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // Marker - Vallacar Terminal
    L.marker([10.73, 122.96]).addTo(map)
      .bindPopup('Vallacar Transit - Talisay Terminal<br>Live Buses Here')
      .openPopup();
  </script>
</body>
</html>
