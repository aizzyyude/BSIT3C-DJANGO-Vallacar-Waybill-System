
{% extends 'base.html' %}

{% block title %}Delete Record | Vallacar{% endblock %}

{% block content %}

<section class="panel delete-panel">
    <div class="delete-icon">
        <i class="fa-solid fa-trash"></i>
    </div>

    <h2>Delete Record?</h2>

    <p>Are you sure you want to delete this record?</p>

    <strong>{{ record }}</strong>

    <form method="post">
        {% csrf_token %}

        <div class="form-buttons">
            <button type="submit" class="danger-button">
                Yes, Delete
            </button>

            <a href="{% url 'record_list' module %}" class="cancel-button">
                Cancel
            </a>
        </div>
    </form>
</section>

{% endblock %}
